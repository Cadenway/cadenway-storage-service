# Definition of storage-service for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/storage-service.yaml for the environment it deploys to.
#
# Internal service: no Traefik label, no published port. Secret values (the database URLs, the NATS
# password, the object storage key) are referenced by name; they live in cadenway-ops, which
# documents every variable below in docs/service-environment.md. A variable added here must exist
# on the host before the release that reads it: the GitOps agent refuses a commit leaving one unset.
#
# INTERNAL_TOKEN_TRUSTED_ISSUERS supplies the Gateway trust list as one line of JSON. Search
# projection routes opt in through the public Search keys and a Storage cursor key shared by
# replicas. These two settings can be empty during a staged rollout.
#
# The S3_* variables are the object storage of the attachments, each from STORAGE_S3_* in
# cadenway-ops. S3_ENDPOINT is where the service reaches it; S3_PUBLIC_ENDPOINT is the host the
# browser follows in a signed URL. STORAGE_UPLOAD_RECEIPT_KEYS is the separate versioned keyring
# used to encrypt upload receipts. Provision it in cadenway-ops before enabling object storage.
#
# MIGRATION_DATABASE_URL is deliberately absent: the GitOps agent of cadenway-ops hands the
# migrator's URL to the one-off migration container only (docs/database.md there), so the running
# service never holds the owner credentials of its schema.
services:
  storage-service:
    image: ghcr.io/${GHCR_OWNER}/cadenway-storage-service:${STORAGE_SERVICE_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3015'
      DATABASE_URL: ${STORAGE_SERVICE_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NATS_USER: storage
      NATS_PASSWORD: ${STORAGE_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: storage-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      SEARCH_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${SEARCH_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      SEARCH_PROJECTION_CURSOR_SECRET: ${STORAGE_SEARCH_PROJECTION_CURSOR_SECRET:-}
      S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${STORAGE_S3_PUBLIC_ENDPOINT}
      S3_REGION: ${STORAGE_S3_REGION}
      S3_BUCKET: ${STORAGE_S3_BUCKET}
      S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE}
      STORAGE_UPLOAD_RECEIPT_KEYS: ${STORAGE_UPLOAD_RECEIPT_KEYS}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3015/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every service definition it includes.
networks:
  internal: {}
