# Definition of storage-service for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/storage-service.yaml for the environment it deploys to.
#
# Internal service: no Traefik label, no published port. Secret values (the database URL carries a
# password) are referenced by name; they live in cadenway-ops.
services:
  storage-service:
    image: ghcr.io/${GHCR_OWNER}/cadenway-storage-service:${STORAGE_SERVICE_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3015'
      DATABASE_URL: ${STORAGE_SERVICE_DATABASE_URL}
      NATS_URL: ${NATS_URL}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3015/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every service definition it includes.
networks:
  internal: {}
